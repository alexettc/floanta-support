import com.google.protobuf.gradle.*
import groovy.json.JsonSlurper

plugins {
    id "com.google.protobuf" version "0.9.4"
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def floantaPlay = localProperties.getProperty('floanta.play') == 'true' ||
        (findProperty('floantaPlay') ?: '').toString() == 'true'
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').toString().split(',').each { encoded ->
        try {
            def decoded = new String(encoded.decodeBase64(), 'UTF-8')
            if (decoded == 'FLOANTA_PLAY=true') {
                floantaPlay = true
            }
        } catch (Exception ignored) {
        }
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = floantaPlay
        ? new File('/home/alex/projects/eshopservices/software/signing/manager/key.properties')
        : rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def resolvedStoreFile = null
def storePath = keystoreProperties.getProperty('storeFile')
if (storePath != null && !storePath.isEmpty()) {
    def candidate = new File(storePath)
    resolvedStoreFile = candidate.isAbsolute()
            ? candidate
            : new File(keystorePropertiesFile.parentFile, storePath)
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Add rustls-platform-verifier Android support
String findRustlsPlatformVerifierMavenDir() {
    def dependencyText = providers.exec {
        it.workingDir = new File("../..")
        commandLine("cargo", "metadata", "--format-version", "1")
    }.standardOutput.asText.get()

    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def pkg = dependencyJson.packages.find { it.name == "rustls-platform-verifier-android" }
    
    if (pkg == null) {
        throw new GradleException("rustls-platform-verifier-android package not found in cargo metadata!")
    }
    
    def manifestPath = file(pkg.manifest_path)
    def mavenDir = new File(manifestPath.parentFile, "maven")
    
    if (!mavenDir.exists()) {
        throw new GradleException("Maven directory not found at: ${mavenDir.path}")
    }
    
    println("✓ Found rustls-platform-verifier maven repo at: ${mavenDir.path}")
    return mavenDir.path
}


repositories {
    maven {
        url = findRustlsPlatformVerifierMavenDir()
        metadataSources.artifact()
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.20.1'
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

android {
    namespace "com.carriez.flutter_hbb"
    compileSdkVersion 36
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        main.proto.srcDirs += '../../../libs/base/protos'
        main.proto.includes += "message.proto"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "floanta.support"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        if (floantaPlay) {
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    signingConfigs {
      release {
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
        storeFile resolvedStoreFile
        storePassword keystoreProperties['storePassword']
      }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.protobuf:protobuf-javalite:3.20.1'
    implementation "androidx.media:media:1.6.0"
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation("org.jetbrains.kotlin:kotlin-stdlib") { version { strictly("1.9.10") } }
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation "rustls:rustls-platform-verifier:0.1.1"
}

if (floantaPlay) {
    def installPermission = ~/<\s*uses-permission\b[^>]*android:name\s*=\s*"android\.permission\.REQUEST_INSTALL_PACKAGES"[^>]*\/\s*>/
    tasks.configureEach { task ->
        if (task.name.contains("Manifest")) {
            task.doLast {
                def manifests = []
                task.outputs.files.each { File output ->
                    if (output.isDirectory()) {
                        output.eachFileRecurse { File child ->
                            if (child.name == "AndroidManifest.xml") {
                                manifests.add(child)
                            }
                        }
                    } else if (output.name == "AndroidManifest.xml") {
                        manifests.add(output)
                    }
                }
                manifests.each { File manifest ->
                    def text = manifest.getText("UTF-8")
                    if (!text.contains("REQUEST_INSTALL_PACKAGES")) {
                        return
                    }
                    def stripped = text.replaceAll(installPermission, "")
                    if (stripped.contains("REQUEST_INSTALL_PACKAGES")) {
                        throw new GradleException("Play manifest still contains REQUEST_INSTALL_PACKAGES: " + manifest)
                    }
                    manifest.write(stripped, "UTF-8")
                }
            }
        }
    }
}
